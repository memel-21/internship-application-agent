[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-application-agent"
version = "0.1.0"
description = "Local human-in-the-loop assistant for preparing and tracking internship applications."
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",
    "sqlalchemy>=2.0.32",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.5.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["internship_agent"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --basetemp=data/pytest_tmp"
testpaths = ["tests"]
pythonpath = ["src"]
